<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
<div class="container">
    <h1>Calculator</h1>
    <div id="content"></div>
    <div class="buttons">
    <button id="btn1" style="height: 50px ; width: 50px;">1</button>
    <button id="btn2" style="height: 50px ; width: 50px;">2</button>
    <button id="btn3" style="height: 50px ; width: 50px;">3</button>
     <button id="btnx" style="height: 50px ; width: 50px;">x</button>
    <button id="btn4" style="height: 50px ; width: 50px;">4</button>
    <button id="btn5" style="height: 50px ; width: 50px;">5</button>
    <button id="btn6" style="height: 50px ; width: 50px;">6</button>
    <button id="btn+" style="height: 50px ; width: 50px;">+</button>
    <button id="btn7" style="height: 50px ; width: 50px;">7</button>
    <button id="btn8" style="height: 50px ; width: 50px;">8</button>
    <button id="btn9" style="height: 50px ; width: 50px;">9</button>
    <button id="btn-" style="height: 50px ; width: 50px;">-</button>
    <button id="btn0" style="height: 50px ; width: 50px;">0</button>     
    <button id="btn*" style="height: 50px ; width: 50px;">*</button>
    <button id="btn/" style="height: 50px ; width: 50px;">/</button>
    <button id="btn=" style="height: 50px ; width: 50px;">=</button>  
    <button id="btnAc" style="height: 50px ; width: 50px;">AC</button>
    <button id="btn." style="height: 50px ; width: 50px;">.</button>
    <button id="btn%" style="height: 50px ; width: 50px;">%</button>
    <button id="btn-dont" style="height: 50px ; width: 50px;">+/-</button></div>
</div>
   <script src="calculator.js"></script> 
</body>
</html>
